name: Diagnóstico de APIs (solo lectura)

# Comprueba contra Polymarket y Polygon reales lo que el bot da por supuesto.
# No envía órdenes, no usa claves privadas y no modifica el repositorio.
on:
  workflow_dispatch:
    inputs:
      address:
        description: "Dirección proxy de un trader (vacío = elegir uno activo automáticamente)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar diagnóstico
        env:
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          HTTP_PROXY_URL: ${{ secrets.HTTP_PROXY_URL }}
          DIAG_ADDRESS: ${{ github.event.inputs.address }}
        run: python scripts/diagnose_api.py --address "$DIAG_ADDRESS"
